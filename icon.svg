<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd6e8"/>
      <stop offset="50%" stop-color="#fff5cc"/>
      <stop offset="100%" stop-color="#c8e7ff"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g font-family="Comic Sans MS, Chalkboard SE, sans-serif" font-weight="900" text-anchor="middle" filter="url(#shadow)">
    <text x="140" y="280" font-size="200" fill="#ff4081" transform="rotate(-8 140 260)">A</text>
    <text x="256" y="320" font-size="240" fill="#2196f3">B</text>
    <text x="380" y="280" font-size="200" fill="#4caf50" transform="rotate(8 380 260)">C</text>
  </g>
  <text x="256" y="430" font-family="Comic Sans MS, Chalkboard SE, sans-serif" font-size="64" font-weight="900" text-anchor="middle" fill="#ff9800" filter="url(#shadow)">⭐ ⭐ ⭐</text>
</svg>
